services:
  proxy-bridge:
    image: python:3.12-slim
    container_name: adan-proxy-bridge
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./scripts/proxy_bridge.py:/scripts/proxy_bridge.py:ro
    command: ["python", "/scripts/proxy_bridge.py"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: adan-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  assistant:
    image: adan-assistant:local
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: http://127.0.0.1:10808
        HTTPS_PROXY: http://127.0.0.1:10808
        http_proxy: http://127.0.0.1:10808
        https_proxy: http://127.0.0.1:10808
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in your shell or .env}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/nemotron-3-embed-1b:free}
      OPENROUTER_RERANKER_MODEL: ${OPENROUTER_RERANKER_MODEL:-nvidia/llama-nemotron-rerank-vl-1b-v2:free}
      ROUTER_MODEL: ${ROUTER_MODEL:-baseten/mammoth-1:free}
      TEXT_MODEL: ${TEXT_MODEL:-nvidia/nemotron-3.5-lightning:free}
      ROUTER_FALLBACK_MODEL: ${ROUTER_FALLBACK_MODEL:-nvidia/nemotron-3.5-lightning:free}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-enterprise_policies}
      DATABASE_PATH: data/database/app.db
    volumes:
      - assistant-cache:/app/.cache/adan

volumes:
  assistant-cache:
  qdrant-storage:
