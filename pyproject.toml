[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adan-assistant"
version = "0.1.0"
description = "CloudScale policy and database assistant built with LangGraph"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2", "sqlglot>=26,<31",
  "llama-index-core>=0.12,<1", "llama-index-vector-stores-qdrant>=0.6,<1",
  "llama-index-embeddings-fastembed>=0.3,<1", "qdrant-client>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]
studio = ["langgraph-cli[inmem]>=0.4,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/adan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: explicitly enabled remote model smoke tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
